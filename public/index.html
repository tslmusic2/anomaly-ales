<!DOCTYPE html>
<html lang="en">

        <head>
                <link rel="stylesheet" href="styles.css">
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width initial-scale=1">


                <title>To Do App</title>
        </head>


        <body>

                <main>

                        <section class="">


                                <div class="container" id="container">

                                        <h3 class="">To Do App</h3>
                                        

                                        <form class="form" id="user-surf-comment-form">

                                                <label class="user-surf-comment-textarea-label">
                                                        Task:
                                                        <textarea class="task-textarea" type="text"
                                                                name="task" required></textarea>
                                                </label>

                                                 <label class="priority-label">
                                                Priority:
                                                <select class="priority" name="priority">
                                                        <option value="none">None</option>
                                                        <option value="low">Low</option>
                                                        <option value="medium">Medium</option>
                                                        <option value="high">High</option>
                                                </select>
                                                </label>

                                                 <button class="btn btn-add-task" id="btn-add-task" type="submit">Add Task</button>


                                        </form>

                                </div>
                        </section>

                </main>

        
        </body>
</html>
